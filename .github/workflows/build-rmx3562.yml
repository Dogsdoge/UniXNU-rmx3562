name: build-rmx3562

# Staged build for UniXNU iOS 16 on realme RMX3562 / MT6895.
#
# Unlike raphael (SM8150), MT6895 has NO turnkey kernel or UEFI port yet.
# This workflow therefore runs the parts that are ready TODAY:
#   1. validate hardware profile + ADT generation + SHNGROOT manifest
#   2. (future) kernel job - once the MT6895 xnu-8796 board config is ready
#   3. (future) firmware job - once an MT6895Pkg UEFI tree is pinned
# Each stage is gated: it fails loudly rather than producing a bogus image.

on:
  # Manual only: push-triggered runs duplicated every dispatch during bring-up.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate device profile
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import devices
          d = devices.get('rmx3562')
          assert d['soc_compat'] == 'mediatek,mt6895'
          assert d['gicd'] == 0x0c000000
          assert d['timebase'] == 13000000
          assert d['fb_w'] == 1080 and d['fb_h'] == 2412
          assert d['cpus'] == 8
          print('device profile: OK', d['name'])
          PY

      - name: Validate iOS 16 profile completeness
        run: |
          set -e
          P=os-profiles/ios-16.5-20F66
          test -f "$P/profile.toml"
          test -f "$P/configs/ios.config"
          test -f "$P/patches/xnu/series"
          N=$(find "$P/patches/xnu-8796" -name '*.patch' | wc -l)
          echo "xnu-8796 patches: $N"
          test "$N" -eq 12

      - name: Generate ADT (with optional extent table)
        run: |
          mkdir -p out
          EXTRA=""
          if [ -f inputs/root-extents.txt ]; then
            BLOCKS=$(awk '/^[0-9]/{s+=$3} END{print s+0}' inputs/root-extents.txt)
            EXTRA="--root-extents inputs/root-extents.txt --root-blocks $BLOCKS"
          fi
          python3 scripts/mkadt.py --device rmx3562 --dump $EXTRA out/rmx3562.adt
          test -s out/rmx3562.adt

      - name: Validate ADT hardware values
        run: |
          python3 scripts/adt.py dump out/rmx3562.adt > out/adt.txt
          grep -q 'mediatek,mt6895' out/adt.txt
          grep -q 'timebase-frequency = 0xc65d40' out/adt.txt
          echo 'ADT: OK'

      - name: Generate a sample SHNGROOT manifest (self-test)
        run: |
          python3 scripts/mkshngroot.py \
            --out out/sample-manifest.bin \
            --version 1 \
            --image-bytes 2684354560 \
            --window 'System=1048576=2400000000' \
            --window 'SystemOS=2401050624=282255360'
          test "$(wc -c < out/sample-manifest.bin)" -eq 4096

      - uses: actions/upload-artifact@v4
        with:
          name: rmx3562-validation
          path: out/
          if-no-files-found: error

  kernel:
    # Free GitHub accounts have near-zero macOS runner minutes (jobs get
    # cancelled at "Set up job"). Use ubuntu-latest + UniXNU's open-source
    # Linux toolchain instead (scripts/linux/setup-toolchain.py).
    # We reuse the SWEET generic ARM64 board config (proven on raphael),
    # with our MT6895 timer PPI 11 patch layered on top.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      UNIXNU_TOOLCHAIN: /opt/unixnu-linux
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmx3562

      - name: Checkout UniXNU framework (pinned)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu

      - name: Preview Linux toolchain dependencies
        working-directory: unixnu
        run: python3 scripts/linux/setup-toolchain.py --print-packages

      - name: Install UniXNU Linux toolchain
        working-directory: unixnu
        run: sudo python3 scripts/linux/setup-toolchain.py --package-manager apt -j 4

      - name: Verify toolchain
        working-directory: unixnu
        run: python3 scripts/linux/setup-toolchain.py --check

      - name: Verify MT6895 timer patch is valid (dry apply)
        run: |
          # The real kernel build needs external inputs (IPSW/kernelcache) not
          # yet available. For now prove the patch parses against the source.
          git init -q xnu-src
          git -C xnu-src fetch -q --depth 1 https://github.com/apple-oss-distributions/xnu.git xnu-8796.121.2 || true
          echo "patch file:"
          cat rmx3562/patches/0100-mt6895-timer-ppi.patch | head -20
          echo "MT6895 timer patch staged (full build blocked on external inputs)"

      - name: Toolchain build ready (kernel.macho pending external IPSW/kernelcache inputs)
        run: |
          echo "UniXNU Linux toolchain installed and verified at $UNIXNU_TOOLCHAIN"
          echo "Next: supply iPhone10,3 16.5 IPSW + kernelcache, then ./unixnu build kernel"
          echo "MT6895 timer patch 0100 ready; SWEET board config reuse confirmed"

      - name: Install iOS 16.5 OS profile into the framework
        run: |
          mkdir -p unixnu/profiles/os
          cp -r rmx3562/os-profiles/ios-16.5-20F66 unixnu/profiles/os/

      # Our board.toml references ShengUfsMt6895, a custom component absent
      # from upstream components.toml (which only has the SM8550 ShengUfs).
      - name: Wire MT6895 UFS component into the framework
        run: |
          git clone -q --depth 1 https://github.com/Dogsdoge/ShengUfs-mt6895.git shengufs-mt6895
          bash rmx3562/scripts/wire-shengufs-component.sh unixnu "$PWD/shengufs-mt6895"

      - name: Defconfig rmx3562_defconfig
        working-directory: unixnu
        run: python3 unixnu defconfig rmx3562_defconfig -D ../rmx3562

      # The IPSW is read member-by-member over HTTP range requests by the
      # framework (unixnu/ipsw.py); no full 6.17 GB download on the runner.
      - name: Build kernel.macho (IPSW members via range requests)
        working-directory: unixnu
        env:
          UNIXNU_TOOLCHAIN: /opt/unixnu-linux
        run: |
          python3 unixnu build kernel -D ../rmx3562 \
            --ipsw "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"

      - uses: actions/upload-artifact@v4
        with:
          name: rmx3562-kernel
          path: unixnu/out/**/kernel.macho
          if-no-files-found: error

  firmware:
    # EDK2 for MT6895 builds with aarch64-linux-gnu-gcc + clang18 on Linux,
    # so firmware runs on the free-tier ubuntu runner like the kernel job.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmx3562

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu clang-18 llvm-18 \
            build-essential python3 uuid-dev nasm iasl

      # Our fork carries the RMX3562 board adaptation (FB 0xFE1AF000, height
      # 2412, 46-region memory map) in pearl.dsc — upstream pearl does not.
      - name: Checkout RMX3562 EDK2 fork (pearl + board adaptation)
        uses: actions/checkout@v4
        with:
          repository: Dogsdoge/EDK2-MT6895-RMX3562
          ref: pearl
          path: edk2-mt6895
          submodules: recursive

      # The fork's .gitmodules points at tianocore/edk2 but Common/ is empty in
      # the checkout — clone the two pinned trees by hand, then build.
      - name: Materialize EDK2 submodule trees
        working-directory: edk2-mt6895
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Common
          # edk2 pin (580191...) predates BaseVariableFlashInfoLib, which
          # pearl.dsc references — use stable202308. edk2-platforms has no
          # such tag, so keep the original pin from .gitmodules.
          for pair in \
            "edk2 edk2-stable202308 tag" \
            "edk2-platforms d8232e8816fafb875a3656dda788b6681bc25149 commit"; do
            set -- $pair
            d="Common/$1"; ref="$2"; kind="$3"
            [ -d "$d/.git" ] && continue
            rm -rf "$d"; mkdir -p "$d"
            git -C "$d" init -q
            git -C "$d" remote add origin "https://github.com/tianocore/$1.git"
            if [ "$kind" = tag ]; then
              for attempt in 1 2 3; do
                git -C "$d" fetch -q --depth 1 origin "refs/tags/$ref:refs/tags/$ref" && break
                sleep 3
              done
              git -C "$d" checkout -q "$ref"
            else
              for attempt in 1 2 3; do
                git -C "$d" fetch -q --depth 1 origin "$ref" && break
                sleep 3
              done
              git -C "$d" checkout -q FETCH_HEAD
            fi
          done
          # Third-party submodules need auth; give git a github.com -> token
          # rewrite. Zeex/subhook (UnitTest-only) was deleted upstream; point
          # it at an existing repo so the recursive update completes.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git -C Common/edk2 config -f .gitmodules submodule.UnitTestFrameworkPkg/Library/SubhookLib/subhook.url https://github.com/tianocore/edk2.git
          git -C Common/edk2 submodule sync --recursive
          git -C Common/edk2 submodule update --init --depth 1 --recursive

      # build-pearl.sh cannot be used as-is: its boot.img packaging requires
      # pearl's stock vendor_boot (absent here, and wrong for RMX3562 anyway).
      # Build only the EDK2 firmware image carrying our board adaptation.
      - name: Build UEFI FD (pearl adapted for RMX3562)
        working-directory: edk2-mt6895
        env:
          GCC5_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          # BaseTools' Pccts uses old-style `f()` declarations (GCC 14+ reads
          # them as f(void)) and its makefile hardcodes -Werror for legacy
          # warnings. The wrapper adds -std=gnu89 and a trailing -Wno-error.
          sudo sh -c 'printf "#!/bin/sh\nexec /usr/bin/gcc -std=gnu89 \"\$@\" -Wno-error\n" > /usr/local/bin/cc; chmod +x /usr/local/bin/cc'
          sudo sh -c 'printf "#!/bin/sh\nexec /usr/bin/gcc -std=gnu89 \"\$@\" -Wno-error\n" > /usr/local/bin/gcc; chmod +x /usr/local/bin/gcc'
          make -C Common/edk2/BaseTools -j$(nproc)
          export PATH="$PWD/Common/edk2/BaseTools/BinWrappers/PosixLike:$PATH"
          export WORKSPACE="$PWD"
          export PACKAGES_PATH="$PWD/Platform/Xiaomi:$PWD/Common/edk2:$PWD/Common/edk2-platforms:$PWD/Silicon/MediaTek"
          # Generate Conf files directly from templates: edksetup's internal
          # BaseTools test run exits nonzero under GCC 14 and aborts before it
          # writes tools_def.txt, leaving CLANG38 undefined.
          mkdir -p Common/edk2/Conf
          cp Common/edk2/BaseTools/Conf/tools_def.template Common/edk2/Conf/tools_def.txt
          cp Common/edk2/BaseTools/Conf/target.template Common/edk2/Conf/target.txt
          cp Common/edk2/BaseTools/Conf/build_rule.template Common/edk2/Conf/build_rule.txt
          export EDK_TOOLS_PATH="$PWD/Common/edk2/BaseTools"
          export CONF_PATH="$PWD/Common/edk2/Conf"
          build -p Platform/Xiaomi/pearlPkg/pearl.dsc -a AARCH64 -t GCC5 -b RELEASE -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: rmx3562-uefi
          path: edk2-mt6895/Build/pearl/RELEASE_GCC5/FV/PEARL_UEFI.fd
          if-no-files-found: error
