name: build-rmx3562

# Staged build for UniXNU iOS 16 on realme RMX3562 / MT6895.
#
# Unlike raphael (SM8150), MT6895 has NO turnkey kernel or UEFI port yet.
# This workflow therefore runs the parts that are ready TODAY:
#   1. validate hardware profile + ADT generation + SHNGROOT manifest
#   2. (future) kernel job - once the MT6895 xnu-8796 board config is ready
#   3. (future) firmware job - once an MT6895Pkg UEFI tree is pinned
# Each stage is gated: it fails loudly rather than producing a bogus image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - board.toml
      - configs/**
      - dts/**
      - os-profiles/**
      - scripts/**
      - patches/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate device profile
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import devices
          d = devices.get('rmx3562')
          assert d['soc_compat'] == 'mediatek,mt6895'
          assert d['gicd'] == 0x0c000000
          assert d['timebase'] == 13000000
          assert d['fb_w'] == 1080 and d['fb_h'] == 2412
          assert d['cpus'] == 8
          print('device profile: OK', d['name'])
          PY

      - name: Validate iOS 16 profile completeness
        run: |
          set -e
          P=os-profiles/ios-16.5-20F66
          test -f "$P/profile.toml"
          test -f "$P/configs/ios.config"
          test -f "$P/patches/xnu/series"
          N=$(find "$P/patches/xnu-8796" -name '*.patch' | wc -l)
          echo "xnu-8796 patches: $N"
          test "$N" -eq 12

      - name: Generate ADT (with optional extent table)
        run: |
          EXTRA=""
          if [ -f inputs/root-extents.txt ]; then
            BLOCKS=$(awk '/^[0-9]/{s+=$3} END{print s+0}' inputs/root-extents.txt)
            EXTRA="--root-extents inputs/root-extents.txt --root-blocks $BLOCKS"
          fi
          python3 scripts/mkadt.py --device rmx3562 --dump $EXTRA out/rmx3562.adt
          test -s out/rmx3562.adt

      - name: Validate ADT hardware values
        run: |
          python3 scripts/adt.py dump out/rmx3562.adt > out/adt.txt
          grep -q 'mediatek,mt6895' out/adt.txt
          grep -q 'timebase-frequency = 0xc65d40' out/adt.txt
          echo 'ADT: OK'

      - name: Generate a sample SHNGROOT manifest (self-test)
        run: |
          python3 scripts/mkshngroot.py \
            --out out/sample-manifest.bin \
            --version 1 \
            --image-bytes 2684354560 \
            --window 'System=1048576=2400000000' \
            --window 'SystemOS=2401050624=282255360'
          test "$(wc -c < out/sample-manifest.bin)" -eq 4096

      - uses: actions/upload-artifact@v4
        with:
          name: rmx3562-validation
          path: out/
          if-no-files-found: error

  kernel:
    # XNU 8796 needs Xcode 15 (iig ABI) -> macos-14. We reuse the SWEET
    # generic ARM64 board config (proven on raphael), with our MT6895 timer
    # PPI 11 patch layered on top. No private defconfig needed.
    runs-on: macos-14
    timeout-minutes: 240
    env:
      MACOS_VERSION: "13.5"
      MACHINE_CONFIG: SWEET
      KERNEL_CONFIG: DEVELOPMENT
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmx3562

      - name: Checkout ios-sweet (XNU 8796 build scripts + sweet platform patches)
        uses: actions/checkout@v4
        with:
          repository: dipa-studio/ios-sweet
          path: ios-sweet

      - name: Fetch darwin-xnu-build at the pinned commit ios-sweet uses
        env:
          DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "https://github.com/blacktop/darwin-xnu-build" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp ios-sweet/xnu/patches/*.patch ios-sweet/xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          # our MT6895 board patches (0100+) sort after ios-sweet's 00xx series
          cp rmx3562/patches/01*.patch dxb/patches/ 2>/dev/null || true
          ls dxb/patches/01*.patch
          # plain arm64 slice: SWEET is arm64, libfirehose is arm64e-only
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -q 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh || echo "::warning::ARCHS sed did not match"

      - name: Host dependencies + Xcode
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU 8796 (SWEET platform + MT6895 timer patch)
        working-directory: dxb
        env:
          MAKEFLAGS: '-k'
          MACHINE_CONFIG: SWEET
          KERNEL_CONFIG: DEVELOPMENT
        run: bash build.sh

      - name: Verify MT6895 timer patch landed
        run: |
          grep -q 'SWEET_VTIMER_INTID        11' dxb/xnu/pexpert/pexpert/arm64/SWEET.h \
            && echo 'MT6895 timer PPI 11: APPLIED' \
            || { echo '::error::MT6895 timer patch skipped'; exit 1; }

      - name: Stage kernel.macho (Mach-O magic check)
        run: |
          mkdir -p rmx3562/inputs/rmx3562
          find dxb -type f -name 'kernel*' 2>/dev/null > /tmp/cands.txt
          K=""
          while IFS= read -r f; do
            sz=$(wc -c < "$f" | tr -d ' ')
            [ "$sz" -gt 2000000 ] || continue
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$magic" = "cffaedfe" ]; then K="$f"; break; fi
          done < /tmp/cands.txt
          [ -n "$K" ] || { echo '::error::no Mach-O kernel found'; exit 1; }
          echo "picked kernel: $K"
          cp "$K" rmx3562/inputs/rmx3562/kernel.macho

      - uses: actions/upload-artifact@v4
        with:
          name: rmx3562-kernel
          path: rmx3562/inputs/rmx3562/kernel.macho
          if-no-files-found: error

  # FUTURE: firmware job (ubuntu, MT6895Pkg EDK2)
  # Candidate: CrackerCat/EDK2-Xiaomi-MediaTek-MT6895 (pearl branch), adapt 3 FB values + memory map
